<!DOCTYPE html>
<html lang="ko" data-theme="hwang">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0c544">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="검색대 적발">
<title>검색대 적발 시 절차</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23f0c544'/><text x='32' y='46' font-size='38' fill='%2317140a' text-anchor='middle' font-family='serif' font-weight='500'>規</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23f0c544'/><text x='90' y='128' font-size='108' fill='%2317140a' text-anchor='middle' font-family='serif' font-weight='500'>規</text></svg>">
<style>
/* =====================================================================
   검색대 적발 시 절차 — 화면 스타일 (v4.2, 「다섯 벌」)
   색·글자·면 처리는 다섯 벌 디자인 시스템(tokens.json)을 따른다.
   슬라이드용 수치(1920×1080)는 앱 크기로 줄이고 역할만 지킨다.
   다국어 안내 앱(heritage-guide v5.0)과 같은 문법이다.

   규칙
   1. 벌 하나에 색 하나. 화면의 색이 사건의 단계를 알린다.
      · 황 벌(치자) — 상황 발생. 검색대에서 불려 나온 때부터(비문화유산 판별 포함)
      · 적 벌(인주) — 일반동산 확정 뒤: 위반 고지 · 필수 서류 · 출국 안내 · 사후 처리
      · 적 벌 짙은 변형(대추) — 강제 처분: 제216조 ③항 긴급 압수 · 전면 거부
      어느 화면이 어느 벌인지는 STATES의 theme 값이 정한다. 값이 없으면 황 벌.
   2. 바탕은 흰색. 모든 면은 직각. 그림자·그라데이션·둥근 모서리 없음.
   3. 색 띠 상자·색동·원형 배지는 쓰지 않는다. 가는 선(seam)과 굵은 먹 선으로만 나눈다.
   4. --mark는 판단이 걸린 자리(필수 표시, 점검 칸, 경고 제목)에만 쓴다.
      황 벌에서는 먹색, 적 벌에서는 인주색, 짙은 변형에서는 대추색이다. 체크를 마친 칸은 먹색으로 채워져 붉은색이 빠진다.
   5. 제목은 명조(앱에 넣은 본명조 300·500), 본문은 기기 고딕.
      글꼴 파일이 없으면(HTML 파일 하나만 열 때) 기기 명조로 바뀌어 보인다.
   6. 전환·변형 모션 없음. 누르는 동안의 색 바뀜만 있다.
   ===================================================================== */

@font-face { font-family: 'Dasot Serif'; font-weight: 300; font-style: normal; font-display: swap; src: url('fonts/dasot-serif-300.woff2') format('woff2'); }
@font-face { font-family: 'Dasot Serif'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/dasot-serif-500.woff2') format('woff2'); }

/* ── 벌(색) — 값은 다섯 벌 tokens.json 그대로 ── */
:root, [data-theme="hwang"] {
  --bg: #ffffff;        /* 바탕 */
  --plane: #f0c544;     /* 색면 — 치자 */
  --ink: #17140a;       /* 제목 */
  --ink-2: #3d3a30;     /* 본문 */
  --mute: #6f6b5e;      /* 덧붙이는 말. 색면 위에는 쓰지 않는다 */
  --seam: #d6d2c4;      /* 가는 선 */
  --on-plane: #17140a;  /* 치자 위에는 짙은 글자 */
  --on-plane-2: #3f3610;
  --mark: #17140a;      /* 판단이 걸린 자리 */
  --mark-ink: #ffffff;
}
[data-theme="jeok"] {
  --bg: #ffffff;
  --plane: #d4311e;     /* 색면 — 인주 */
  --ink: #141414;
  --ink-2: #3b3b3b;
  --mute: #6e6e6e;
  --seam: #d2d2d2;
  --on-plane: #ffffff;
  --on-plane-2: #ffffff; /* 토큰 값 #ffe3dd는 인주 위에서 대비가 4.06:1이라 작은 글자에는 흰색을 쓴다 */
  --mark: #d4311e;
  --mark-ink: #ffffff;
}

/* 적 벌의 짙은 변형(대추색) — 강제 처분 화면. 화면 전체를 덮는 경고 면에만 쓰는 값이다 */
[data-theme="jeok-deep"] {
  --bg: #ffffff;
  --plane: #8a1c1c;     /* 색면 — 대추 */
  --ink: #141414;
  --ink-2: #3b3b3b;
  --mute: #6e6e6e;
  --seam: #d2d2d2;
  --on-plane: #ffffff;
  --on-plane-2: #ffe3dd;
  --mark: #8a1c1c;
  --mark-ink: #ffffff;
}

:root {
  /* 제목 — 본명조. 앱에 넣은 파일이 먼저, 없으면 기기 명조 */
  --serif: 'Dasot Serif', 'Noto Serif KR', 'Noto Serif CJK KR', 'AppleMyungjo', 'Batang', serif;
  /* 본문·조작부 — 기기 고딕 (웹폰트 없음: 오프라인·미설치 기기 대응) */
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;

  /* 기기 안전 영역 — 홈 화면 실행·가로 화면(노치) 대응. 해당 없는 기기에서는 0 */
  --safe-t: env(safe-area-inset-top, 0px);  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  /* 본문 단 너비 688px. 좁은 화면에서는 좌우 16px */
  --gx-l: max(16px, var(--safe-l), calc((100% - 688px) / 2));
  --gx-r: max(16px, var(--safe-r), calc((100% - 688px) / 2));
  --crumb-h: 38px;   /* 경로 줄 높이 — 절반이 색면에 걸친다 */
}

/* ── 바탕 ── */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body.heritage {
  background: var(--bg); color: var(--ink-2);
  font-family: var(--sans); font-size: 15px; line-height: 1.65;
  min-height: 100vh; overscroll-behavior-y: contain;
}
.heritage button { font-family: inherit; border-radius: 0; }
.heritage strong { color: var(--ink); font-weight: 700; }
.heritage a { color: var(--ink); text-underline-offset: 3px; }
.heritage :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ── 머리 — 색면 + 경로 줄. 경로 줄은 색면 아랫변에 걸친다 (화면 위에 고정) ── */
.topbar { position: sticky; top: 0; z-index: 100; background: var(--bg); padding-bottom: 10px; border-bottom: 1px solid var(--seam); }
.topbar::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0;
  bottom: calc(var(--crumb-h) / 2 + 11px);   /* 아래 여백 10px + 선 1px + 경로 줄 절반 */
  background: var(--plane);
}
.h-header {
  position: relative; color: var(--on-plane);
  display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap;
  padding: calc(10px + var(--safe-t)) var(--gx-r) 10px var(--gx-l);
}
.h-brand { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.3; letter-spacing: -.01em; word-break: keep-all; }
.h-sub { font-size: 13px; color: var(--on-plane-2); }
.header-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.header-btn {
  position: relative; cursor: pointer;
  background: transparent; border: 1.5px solid var(--on-plane); color: var(--on-plane);
  min-height: 38px; padding: 4px 13px; font-size: 14px; font-weight: 500; line-height: 1.3;
}
.header-btn::after { content: ""; position: absolute; inset: -4px; }   /* 누르는 자리 46px */
.header-btn:active { background: var(--on-plane); color: var(--plane); }
.h-header :focus-visible { outline-color: var(--on-plane); }

.crumb-bar { position: relative; padding: 0 var(--gx-r) 0 var(--gx-l); }
.breadcrumb {
  background: var(--bg); border: 1.5px solid var(--ink);
  min-height: var(--crumb-h); padding: 6px 12px;
  display: flex; align-items: center; flex-wrap: wrap; gap: 0 7px;
  font-size: 13.5px; line-height: 1.5; color: var(--ink-2); word-break: keep-all;
}
.breadcrumb-track { font-weight: 700; color: var(--ink); }
.breadcrumb-sep { color: var(--mute); }
.breadcrumb-step.current { color: var(--ink); font-weight: 700; }

/* ── 본문 단 ── */
.container { padding: 24px var(--gx-r) 72px var(--gx-l); }

/* ── 구획 — 상자 없이 흰 바탕 위에. 굵은 먹 선 하나로 나눈다 ── */
.card { border-top: 2px solid var(--ink); padding-top: 14px; margin-bottom: 34px; }
.container > .card:first-child { border-top: none; padding-top: 0; }

.card-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 2px 12px; flex-wrap: wrap; margin-bottom: 6px; }
.card-step { font-size: 13.5px; font-weight: 700; color: var(--ink-2); word-break: keep-all; }
.card-time { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.card-title {
  font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.34; letter-spacing: -.01em;
  color: var(--ink); margin-bottom: 14px; word-break: keep-all;
}
.card-title .meta-tag { font-family: var(--sans); letter-spacing: 0; vertical-align: middle; position: relative; top: -2px; }
.card-desc { color: var(--ink-2); font-size: 15px; line-height: 1.65; margin-bottom: 12px; word-break: keep-all; }
.card-note { color: var(--mute); font-size: 13px; line-height: 1.6; margin-top: 10px; word-break: keep-all; }

/* ── 선택 — 가는 명조 한자 한 글자를 크게 세우고, 가는 선으로만 나눈다 ── */
.choice-grid { display: flex; flex-direction: column; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--seam); }
.choice-btn:last-child { border-bottom: none; }
.choice-btn {
  width: 100%; text-align: left; cursor: pointer;
  background: var(--bg); color: var(--ink); border: none; border-bottom: 1px solid var(--seam);
  padding: 13px 4px 12px; min-height: 76px;
  display: flex; align-items: center; gap: 14px;
}
.choice-icon {
  font-family: var(--serif); font-weight: 300; font-size: 44px; line-height: 1;
  width: 50px; flex-shrink: 0; text-align: center; color: inherit;
}
.choice-text { flex: 1; min-width: 0; }
.choice-label { display: block; font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.4; letter-spacing: -.01em; word-break: keep-all; }
.choice-desc { display: block; margin-top: 1px; font-size: 13.5px; line-height: 1.5; color: var(--mute); word-break: keep-all; }
.choice-arrow { flex-shrink: 0; font-size: 22px; line-height: 1; color: inherit; padding-right: 2px; }
@media (hover: hover) {
  .choice-btn:hover .choice-label { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
}
/* 누르는 동안 그 벌의 색으로 밑칠 */
.choice-btn:active { background: var(--plane); color: var(--on-plane); }
.choice-btn:active .choice-desc { color: var(--on-plane-2); }

/* ── 점검 목록 — 위아래 먹 선, 항목 사이는 가는 선 ── */
.checklist { display: flex; flex-direction: column; margin: 18px 0; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 6px 12px 4px; min-height: 48px;
  border-bottom: 1px solid var(--seam); cursor: pointer; user-select: none; -webkit-user-select: none;
}
.check-item:last-child { border-bottom: none; }
/* 점검 칸 — 남은 항목은 --mark 테두리, 마친 항목은 먹색 채움 */
.check-box {
  width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--mark); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.check-item.checked .check-box { background: var(--ink); border-color: var(--ink); }
.check-item.checked .check-box::after {
  content: ""; width: 6px; height: 11px; margin-top: -2px;
  border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.check-label { flex: 1; min-width: 0; font-size: 15px; line-height: 1.55; color: var(--ink); word-break: keep-all; }
.check-label-text { display: block; }
.check-item.checked .check-label-text { color: var(--mute); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--mute); }
.check-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
/* 필수인데 빠진 항목 — 굵은 틀. 체크할 때까지 그대로 둔다 */
.check-item.miss { outline: 2px solid var(--mark); outline-offset: -2px; padding-left: 10px; padding-right: 10px; }
.check-item.miss .meta-tag.warn { background: var(--mark); color: var(--mark-ink); }
.check-item.checked .meta-tag.warn { border-color: var(--mute); color: var(--mute); }   /* 마친 항목은 표시도 가라앉힌다 */

/* ── 태그 — 테두리 네모. '필수'는 놓치면 안 되므로 굵은 테두리(판정 인 방식) ── */
.meta-tag {
  display: inline-flex; align-items: center; padding: 0 6px;
  font-size: 12px; font-weight: 400; line-height: 1.7; white-space: normal; word-break: keep-all;
  background: var(--bg); border: 1px solid var(--mute); color: var(--mute);
}
.meta-tag.law { color: var(--ink-2); }
.meta-tag.warn { border: 2px solid var(--mark); color: var(--mark); font-weight: 700; line-height: 1.55; }

/* ── 안내 — 위쪽 가는 선 하나. 경고는 먹 틀에 제목만 --mark ── */
.info-box {
  border-top: 1px solid var(--seam); padding: 12px 0 0; margin: 16px 0;
  font-size: 14px; line-height: 1.7; color: var(--ink-2); word-break: keep-all;
}
.info-box-title { display: block; font-size: 14px; font-weight: 700; line-height: 1.5; color: var(--ink); margin-bottom: 4px; }
.info-box.warn { border: 1.5px solid var(--ink); padding: 12px 14px 13px; }
/* 바로 위가 선으로 끝나는 묶음이면 선을 겹치지 않는다 */
.choice-grid + .info-box:not(.warn), details.field + .info-box:not(.warn) { border-top: none; padding-top: 0; }
.info-box.warn .info-box-title { color: var(--mark); }
.info-box ul, .info-box ol { padding-left: 1.2rem; margin: 6px 0; }
.info-box li { margin: 3px 0; }
.info-box p { margin-bottom: 6px; }
.container > .info-box:last-child { color: var(--mute); font-size: 13px; }

/* ── 접이 — 가는 선 사이에 제목 한 줄 ── */
details.field { border-top: 1px solid var(--seam); border-bottom: 1px solid var(--seam); }
details.field + details.field { border-top: none; }
details.field summary {
  list-style: none; cursor: pointer; user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 50px; padding: 10px 4px;
  font-size: 15px; font-weight: 700; line-height: 1.45; color: var(--ink); word-break: keep-all;
}
details.field summary::-webkit-details-marker { display: none; }
details.field summary > span { margin-right: auto; font-size: 12.5px; font-weight: 400; color: var(--mute); }
details.field summary::after { content: '+'; flex-shrink: 0; font-family: var(--serif); font-weight: 300; font-size: 26px; line-height: 1; color: var(--ink); }
details.field[open] summary::after { content: '−'; }
details.field .field-body { padding: 0 4px 16px; font-size: 14px; line-height: 1.65; color: var(--ink-2); }
details.field .field-body h4 { font-size: 13.5px; font-weight: 700; color: var(--ink); margin: 12px 0 4px; }
details.field .field-body h4:first-child { margin-top: 0; }
details.field .field-body ol, details.field .field-body ul { padding-left: 1.35rem; margin: 3px 0; }
details.field .field-body li { margin: 3px 0; word-break: keep-all; }
details.field .field-body .field-note { font-size: 13px; color: var(--mute); margin-top: 5px; word-break: keep-all; }
details.field .field-body .field-note.strong { color: var(--ink); font-weight: 500; margin-top: 10px; }
details.field .field-body .examples { border-top: 1px solid var(--seam); padding-top: 9px; margin-top: 11px; font-size: 13px; line-height: 1.6; color: var(--mute); word-break: keep-all; }
details.field .field-body .examples strong { margin-right: 4px; }

/* ── 이동 단추 — 먹색 채움 / 먹 테두리 ── */
.nav-row { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.nav-btn {
  flex: 1; min-width: 130px; min-height: 50px; padding: 12px 16px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg);
  font-size: 15px; font-weight: 700; line-height: 1.3;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.nav-btn.secondary { background: var(--bg); color: var(--ink); }
@media (hover: hover) {
  .nav-btn:hover { background: var(--ink-2); border-color: var(--ink-2); }
  .nav-btn.secondary:hover { background: var(--bg); border-color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
}
.nav-btn:active { background: var(--plane); border-color: var(--plane); color: var(--on-plane); }

/* ── 요약 ── */
.summary-section { margin-bottom: 24px; }
.summary-section h3 { font-family: var(--sans); font-size: 14px; font-weight: 700; line-height: 1.5; color: var(--ink); padding-bottom: 6px; border-bottom: 1.5px solid var(--ink); }
.summary-list { font-size: 14.5px; color: var(--ink-2); }
.summary-list-item { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--seam); }
.summary-key { color: var(--mute); flex-shrink: 0; }
.summary-val { color: var(--ink); font-weight: 500; text-align: right; word-break: break-all; }
.summary-checks { padding-top: 6px; }
.summary-check { display: flex; gap: 10px; padding: 5px 0; line-height: 1.55; word-break: keep-all; }
.summary-time { flex-shrink: 0; min-width: 3.1em; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.summary-offpath, .summary-offpath .summary-time { color: var(--mute); }

/* ── 창 ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-backdrop.active { display: flex; }
.modal { background: var(--bg); border: 1.5px solid var(--ink); max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal-header { padding: 18px 18px 0; }
.modal-title { font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 1.4; letter-spacing: -.01em; color: var(--ink); }
.modal-body { padding: 12px 18px; font-size: 14.5px; line-height: 1.65; }
.modal-footer { padding: 6px 18px 18px; display: flex; gap: 8px; justify-content: flex-end; }

  inputs: {},         // 자유 입력값

function saveState() {
  if (!caseState.track) return;
  try { localStorage.setItem('appraisal_case', JSON.stringify(caseState)); }
  catch (e) { /* 사생활 보호 모드 등 저장 불가 — 진행 자체는 계속 */ }
}

function loadState() {
  let saved = null;
  try { saved = localStorage.getItem('appraisal_case'); } catch (e) { return null; }
  if (saved) {
    try {
      const obj = JSON.parse(saved);
      if (obj && !obj.checkLabels) obj.checkLabels = {};  // 구버전 저장 호환
      if (obj && !obj.checkTimes) obj.checkTimes = {};
      if (obj && !obj.checks) obj.checks = {};
      return obj;
    }
    catch(e) { return null; }
  }
  return null;
}

// 이 기기에 남아 있는 '다른' 진행 중 사건 (지금 화면의 사건과 시작 시각이 다른 것)
function resumableCase() {
  const saved = loadState();
  if (!saved || !saved.trail || saved.trail.length <= 1) return null;
  if (saved.startedAt && saved.startedAt === caseState.startedAt) return null;
  return saved;
}

function clearState() {
  try { localStorage.removeItem('appraisal_case'); } catch (e) {}
  caseState = { startedAt: null, track: null, is_sjp: null, trail: [], checks: {}, checkLabels: {}, checkTimes: {}, inputs: {} };
}

// ===== 유틸 =====
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtClock(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);   // 연달아 띄울 때 앞선 타이머가 새 안내를 일찍 지우지 않게
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function showModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const footer = document.getElementById('modalFooter');
  footer.innerHTML = '';
  (buttons || [{label:'닫기', className:'nav-btn secondary', action:closeModal}]).forEach(b => {
    const btn = document.createElement('button');
    btn.className = b.className || 'nav-btn primary';
    btn.textContent = b.label;
    btn.onclick = b.action || closeModal;
    footer.appendChild(btn);
  });
  document.getElementById('modal').classList.add('active');
}

  document.getElementById('modal').classList.remove('active');

//   렌더링 헬퍼
// ═══════════════════════════════════════════

function renderChecklist(stateId, items) {
  return `<div class="checklist">${items.map(it => {
    const checkId = `${stateId}.${it.id}`;
    const checked = caseState.checks[checkId] ? 'checked' : '';
    const metaHtml = (it.meta || []).map(m => {
      return `<span class="meta-tag ${m.type}">${m.text}</span>`;
    }).join('');
    return `
      <div class="check-item ${checked}" data-check-id="${checkId}" role="checkbox" aria-checked="${checked ? 'true' : 'false'}" tabindex="0" onclick="toggleCheck('${checkId}', this)" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleCheck('${checkId}', this);}">
        <div class="check-box"></div>
        <div class="check-label">
          <span class="check-label-text">${it.label}</span>
          ${metaHtml ? `<div class="check-meta">${metaHtml}</div>` : ''}
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

// 트랙·특사경·분기 라벨을 한 곳에서 계산 (요약·복사에서 공용)
function computeCaseLabels() {
  const t = caseState.track;
  const trackLabel = t === 'checkpoint' ? '검색대 — 일반동산 적발' : '—';
  const sjpLabel = caseState.is_sjp === true ? '특사경 본인'
                   : caseState.is_sjp === false ? '특사경 부재'
                   : '—';
  const wasRefused = caseState.trail.includes('refuse');
  const wasSeized = caseState.trail.includes('seize_216');
  const wasReleased = caseState.trail.includes('release');
  const wasReleasedRefused = caseState.trail.includes('release_refused');
  const prefix = wasReleasedRefused ? '신청서 거부 → ' : '';
  const branchLabel = wasReleased ? prefix + '비문화유산 판별 · 출국'
                      : wasRefused ? prefix + '전면 거부 · 현행범 검토'
                      : wasSeized ? prefix + '임의제출 거부 · 제216조③ 압수'
                      : caseState.trail.includes('cooperate') ? prefix + '임의제출 동의'
                      : '—';
  return { trackLabel, sjpLabel, branchLabel };
}

// 체크리스트 키 → 그 체크리스트가 놓인 화면
const CHECKLIST_SCREEN = { cooperate_optional: 'cooperate', refuse_sjp: 'refuse', refuse_nonsjp: 'refuse' };

// 완료 항목을 체크한 시각순으로. 되돌아가 버린 분기에서 체크한 것은 지우지 않고 표시만 구분
function collectChecks() {
  const times = caseState.checkTimes || {};
  return Object.keys(caseState.checks).filter(k => caseState.checks[k]).map((k, i) => {
    const group = k.split('.')[0];
    const screen = CHECKLIST_SCREEN[group] || group;
    return { key: k, order: i, time: times[k] || '', label: caseState.checkLabels[k] || k, onPath: caseState.trail.includes(screen) };
  }).sort((a, b) => (a.time && b.time) ? (a.time < b.time ? -1 : a.time > b.time ? 1 : a.order - b.order) : a.order - b.order);
}

// 거쳐 온 화면 이름 (시작·요약 제외)
function pathLabel() {
  const names = caseState.trail.filter(id => id !== 'start' && id !== 'summary' && STATES[id])
    .map(id => { const c = STATES[id].crumb; return c[c.length - 1]; });
  return names.length ? names.join(' → ') : '—';
}

function renderResumeCard() {
  const saved = resumableCase();
  if (!saved) return '';
  const last = STATES[saved.trail[saved.trail.length - 1]];
  const where = last ? last.crumb.join(' › ') : '—';
  const done = Object.values(saved.checks || {}).filter(Boolean).length;
  return `
      <div class="card accent">
        <div class="card-meta">
          <span class="card-step">진행 중인 사건</span>
          <span class="card-time">${saved.startedAt ? '시작 ' + fmtTime(saved.startedAt) : ''}</span>
        </div>
        <h2 class="card-title">이어서 진행하시겠습니까?</h2>
        <p class="card-desc">이 기기에 저장된 사건이 있습니다. 마지막 화면은 <strong>${where}</strong>, 체크한 항목은 ${done}건입니다.</p>
        <div class="nav-row" style="margin-top:0;">
          <button class="nav-btn primary" onclick="resumeCase()">이어서 하기 ›</button>
          <button class="nav-btn secondary" onclick="discardSaved()">지우고 새로 시작</button>
        </div>
      </div>`;
}

function renderSummary() {
  const { trackLabel, sjpLabel, branchLabel } = computeCaseLabels();
  const startedFmt = caseState.startedAt ? fmtTime(caseState.startedAt) : '—';

  const checkEntries = collectChecks();
  const hasOffPath = checkEntries.some(e => !e.onPath);

  return `
    <div class="card accent">
      <div class="card-meta"><span class="card-step">진행 완료</span></div>
      <h2 class="card-title">사건 진행 요약</h2>
      <div class="summary-section">
        <h3>기본 정보</h3>
        <div class="summary-list">
          <div class="summary-list-item"><span class="summary-key">진입 트랙</span><span class="summary-val">${trackLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">시작 시각</span><span class="summary-val">${startedFmt}</span></div>
          <div class="summary-list-item"><span class="summary-key">특사경 자격</span><span class="summary-val">${sjpLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">분기</span><span class="summary-val">${branchLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">진행 경로</span><span class="summary-val" style="word-break:keep-all;">${pathLabel()}</span></div>
        </div>
      </div>
      <div class="summary-section">
        <h3>완료 항목 (${checkEntries.length}건)</h3>
        <div class="summary-list summary-checks">
          ${checkEntries.length ? checkEntries.map(e => {
            return `<div class="summary-check${e.onPath ? '' : ' summary-offpath'}"><span class="summary-time">${e.time ? fmtClock(e.time) : '✓'}</span><span>${e.label}${e.onPath ? '' : ' — 되돌아간 분기'}</span></div>`;
          }).join('') : '<div style="color:var(--mute);">완료 항목 없음</div>'}
        </div>
        <p class="card-note">시각은 항목을 체크한 때입니다. 실제 조치 시각과 다르면 경위서에는 실제 시각을 적으십시오.${hasOffPath ? ' "되돌아간 분기"는 뒤로 돌아가 다른 경로를 택하기 전에 체크한 항목입니다.' : ''}</p>
      </div>
      <div class="nav-row">
        <button class="nav-btn secondary" onclick="copyReport()">요약 복사</button>
        <button class="nav-btn primary" onclick="if(confirm('새 사건으로 진행하시겠습니까? 현재 기록은 삭제됩니다.')){clearState();navigate('start');}">새 사건 ›</button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════
//   상태 머신 액션
// ═══════════════════════════════════════════

// 벌(색) — 화면마다 STATES의 theme 값을 따른다. 값이 없으면 황 벌
const THEMES = { hwang: '#f0c544', jeok: '#d4311e', 'jeok-deep': '#8a1c1c' };
function applyTheme(id) {
  if (!THEMES[id]) id = 'hwang';
  document.documentElement.setAttribute('data-theme', id);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', THEMES[id]);
}

function renderState(stateId) {
  const state = STATES[stateId];
  if (!state) return;
  applyTheme(state.theme);
  document.getElementById('app').innerHTML = state.render();
  document.getElementById('toast').classList.remove('show');   // 앞 화면의 안내가 새 화면을 가리지 않게
  renderBreadcrumb(state);
  window.scrollTo(0, 0);
  if (state.onMount) state.onMount();
  document.getElementById('resumeBtn').style.display = (stateId === 'start' && resumableCase()) ? '' : 'none';
}

function navigate(stateId) {
  const state = STATES[stateId];
  if (!state) { console.warn('Unknown state:', stateId); return; }

  if (state.track && !caseState.track) caseState.track = state.track;

  caseState.trail.push(stateId);
  // 'start' 화면은 진행 시작 전이므로 저장하지 않음 (이전 saved 보존)
  if (stateId !== 'start') saveState();

  renderState(stateId);
}

// 필수 항목 체크 검증 후 진행. 미체크 시 토스트 + 시각 강조
function tryNavigate(targetState, stateId, requiredIds) {
  const missing = requiredIds.filter(id => !caseState.checks[`${stateId}.${id}`]);
  if (missing.length > 0) {
    showToast(`필수 항목 ${missing.length}개를 먼저 체크해 주십시오`, 'warn');
    let first = null;
    missing.forEach(id => {
      const el = document.querySelector(`[data-check-id="${stateId}.${id}"]`);
      if (el) {
        // 모션 없이 굵은 틀로 강조. 체크할 때까지 유지
        el.classList.add('miss');
        if (!first) first = el;
      }
    });
    // 버튼은 목록 아래에 있어 빠진 항목이 화면 밖일 수 있음 — 첫 항목으로 즉시 이동(모션 없음)
    if (first) first.scrollIntoView({ block: 'center' });
    return;
  }
  navigate(targetState);
}

// 특사경 역할 설정 후 진행
function setSjpRole(isSjp) {
  if (resumableCase()) {
    if (!confirm('이 기기에 저장된 진행 중 사건이 있습니다. 새 사건을 시작하면 그 기록은 지워집니다. 계속하시겠습니까?')) return;
    try { localStorage.removeItem('appraisal_case'); } catch (e) {}
  }
  caseState.is_sjp = isSjp;
  // 사건 시작 시각 — 앱을 열어둔 시각이 아니라 실제 절차 진입 시점에 기록
  if (!caseState.startedAt) caseState.startedAt = new Date().toISOString();
  navigate('arrival');
}

function goBack() {
  if (caseState.trail.length <= 1) {
    caseState.trail = [];   // 'start' 중복 축적 방지
    navigate('start');
    return;
  }
  caseState.trail.pop(); // remove current
  const prev = caseState.trail.pop();
  navigate(prev);
}

function renderBreadcrumb(state) {
  const crumb = document.getElementById('breadcrumb');
  const items = state.crumb || ['시작'];
  crumb.innerHTML = items.map((c, i) => {
    if (i === 0) return `<span class="breadcrumb-track">${c}</span>`;
    const isLast = i === items.length - 1;
    return `<span class="breadcrumb-sep">›</span><span class="breadcrumb-step ${isLast?'current':''}">${c}</span>`;
  }).join('');
}

function toggleCheck(id, el) {
  if (!caseState.checkLabels) caseState.checkLabels = {};
  if (!caseState.checkTimes) caseState.checkTimes = {};
  const now = !caseState.checks[id];
  caseState.checks[id] = now;
  if (now) { caseState.checkTimes[id] = new Date().toISOString(); el.classList.remove('miss'); }
  else delete caseState.checkTimes[id];
  el.classList.toggle('checked', now);
  el.setAttribute('aria-checked', now ? 'true' : 'false');
  // 요약·기록에서 내부 ID 대신 사람이 읽는 라벨이 나오도록 보존
  const labelEl = el.querySelector('.check-label-text');
  if (labelEl) caseState.checkLabels[id] = labelEl.textContent.trim();
  saveState();
}

function copyReport() {
  const { trackLabel, sjpLabel, branchLabel } = computeCaseLabels();

  let txt = `[감정 절차 기록]\n`;
  txt += `진입 트랙: ${trackLabel}\n`;
  txt += `시작 시각: ${fmtTime(caseState.startedAt)}\n`;
  txt += `특사경 자격: ${sjpLabel}\n`;
  txt += `분기: ${branchLabel}\n`;
  txt += `진행 경로: ${pathLabel()}\n\n`;

  const checks = collectChecks();
  if (checks.length) {
    txt += `[완료 항목 ${checks.length}건 — 시각은 체크한 때]\n`;
    checks.forEach(e => { txt += `${e.time ? fmtClock(e.time) : '✓'} ${e.label}${e.onPath ? '' : ' (되돌아간 분기)'}\n`; });
  }
  txt += `\n기록 출력: ${fmtTime(new Date().toISOString())}\n`;

  const fallback = () => {
    const pre = document.createElement('pre');
    pre.style.cssText = 'white-space:pre-wrap;font-family:var(--sans);font-size:.875rem;user-select:text;';
    pre.textContent = txt;
    showModal('요약 — 길게 눌러 복사', '');
    document.getElementById('modalBody').appendChild(pre);
  };
  // 보안 연결이 아니거나 권한이 없으면 clipboard 자체가 없을 수 있음
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => {
      showToast('요약이 클립보드에 복사되었습니다', 'success');
    }).catch(fallback);
  } else {
    fallback();
  }
}

// ═══════════════════════════════════════════
//   초기화
// ═══════════════════════════════════════════

document.getElementById('resetBtn').onclick = () => {
  // 절차에 들어가지 않은 첫 화면에서는 지울 것이 없음 — 저장된 다른 사건은 첫 화면 카드에서만 지움
  if (!caseState.startedAt) { caseState.trail = []; navigate('start'); return; }
  if (!confirm('진행 중인 사건이 있습니다. 처음으로 돌아가면 삭제됩니다. 계속하시겠습니까?')) return;
  clearState();
  navigate('start');
};

function resumeCase() {
  const saved = resumableCase();
  if (!saved) { showToast('복구할 진행 상태가 없습니다', 'warn'); return; }
  caseState = saved;
  const lastState = saved.trail[saved.trail.length - 1];
  renderState(STATES[lastState] ? lastState : 'arrival');
  showToast('이전 진행 상태를 복구했습니다', 'success');
}

function discardSaved() {
  if (!confirm('저장된 사건 기록을 지우고 새로 시작합니다. 계속하시겠습니까?')) return;
  clearState();
  navigate('start');
}

document.getElementById('resumeBtn').onclick = resumeCase;

// 모달 배경 클릭 시 닫기
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// Esc 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// 시작
(function init() {
  // 저장된 진행 중 사건이 있으면 첫 화면 맨 위 카드와 헤더 '복구' 버튼으로 이어서 할 수 있음
  navigate('start');
})();
</script>

</body>
</html>
