<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1f3354">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="검색대 적발">
<title>검색대 적발 시 절차</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231f3354'/><text x='32' y='46' font-size='38' fill='%23a8843a' text-anchor='middle' font-family='serif' font-weight='600'>規</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='32' fill='%231f3354'/><text x='90' y='128' font-size='108' fill='%23a8843a' text-anchor='middle' font-family='serif' font-weight='600'>規</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf8f1;
    --bg-alt: #f3ecdd;
    --paper: #ffffff;
    --ink: #1a1f2e;
    --ink-soft: #4a5266;
    --primary: #1f3354;
    --primary-light: #324b7a;
    --primary-bg: #e8edf5;
    --accent: #8b3a3a;
    --accent-light: #c97676;
    --accent-bg: #f5e7e7;
    --gold: #a8843a;
    --gold-soft: #d4b87a;
    --line: #d8cfb9;
    --line-soft: #e8e1d0;
    --green: #4a6b3a;
    --green-bg: #ecf2e3;
    --shadow: 0 1px 3px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.04);
    --shadow-lg: 0 4px 12px rgba(20,30,50,.08), 0 16px 32px rgba(20,30,50,.06);
    --font-display: 'Noto Serif KR', serif;
    --font-body: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    --font-en: 'Cormorant Garamond', 'Noto Serif KR', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    overscroll-behavior-y: contain;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(31,51,84,.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(168,132,58,.04) 0%, transparent 50%);
  }

  /* HEADER */
  .header {
    background: linear-gradient(180deg, var(--primary) 0%, #182841 100%);
    color: #f5f0e0;
    padding: 1rem 1.25rem .85rem;
    border-bottom: 3px solid var(--gold);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(20,30,50,.15);
  }
  .header-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
  }
  .title-group { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .title-kor {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -.01em;
    color: #faf5e6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title-sub {
    font-family: var(--font-en);
    font-style: italic;
    font-size: .78rem;
    color: rgba(245,240,224,.65);
  }
  .title-deco { color: var(--gold); margin: 0 .35rem; font-style: normal; }
  .header-actions { display: flex; gap: .35rem; flex-shrink: 0; }
  .header-btn {
    background: rgba(0,0,0,.2);
    color: rgba(245,240,224,.85);
    border: 1px solid rgba(168,132,58,.3);
    padding: .4rem .65rem;
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: .8rem;
    cursor: pointer;
    transition: all .15s;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    gap: .3rem;
  }
  .header-btn:hover { background: rgba(168,132,58,.2); color: #faf5e6; }
  .header-btn.danger:hover { background: rgba(139,58,58,.4); }

  /* PROGRESS BREADCRUMB */
  .breadcrumb {
    max-width: 720px;
    margin: 0 auto;
    padding: .5rem 1.25rem .5rem;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--line-soft);
    font-family: var(--font-body);
    font-size: .75rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: .35rem;
    flex-wrap: wrap;
    min-height: 32px;
  }
  .breadcrumb-track {
    font-family: var(--font-en);
    font-weight: 600;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-size: .72rem;
  }
  .breadcrumb-track.violation { color: var(--accent); }
  .breadcrumb-sep { color: var(--line); }
  .breadcrumb-step { color: var(--ink-soft); }
  .breadcrumb-step.current { color: var(--primary); font-weight: 500; }

  /* MAIN */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1.25rem 5rem;
  }

  /* CARDS */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.25rem;
    box-shadow: var(--shadow);
    margin-bottom: 1rem;
  }
  .card.accent { border-left: 4px solid var(--gold); }
  .card.violation { border-left: 4px solid var(--accent); background: linear-gradient(180deg, #fdf7f7 0%, var(--paper) 60%); }
  .card.success { border-left: 4px solid var(--green); background: linear-gradient(180deg, #f7faf3 0%, var(--paper) 60%); }
  .card.info { border-left: 4px solid var(--primary); }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .85rem;
    padding-bottom: .65rem;
    border-bottom: 1px solid var(--line-soft);
    gap: .5rem;
    flex-wrap: wrap;
  }
  .card-step {
    font-family: var(--font-en);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--gold);
    font-weight: 600;
  }
  .card-step.violation { color: var(--accent); }
  .card-title {
    font-family: var(--font-display);
    font-size: 1.2rem;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: -.01em;
    margin-bottom: .35rem;
    line-height: 1.4;
  }
  .card-title.violation { color: var(--accent); }
  .card-subtitle {
    font-family: var(--font-en);
    font-style: italic;
    font-size: .85rem;
    color: var(--ink-soft);
    margin-bottom: .85rem;
  }
  .card-desc {
    color: var(--ink-soft);
    font-size: .92rem;
    line-height: 1.65;
    margin-bottom: 1rem;
  }
  .card-desc strong { color: var(--ink); font-weight: 500; }

  /* CHOICE BUTTONS */
  .choice-grid { display: flex; flex-direction: column; gap: .65rem; }
  .choice-btn {
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1rem 1.1rem;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
    transition: all .15s ease;
    display: flex;
    align-items: center;
    gap: .85rem;
    min-height: 64px;
    width: 100%;
  }
  .choice-btn:hover { background: var(--primary-bg); border-color: var(--primary-light); transform: translateX(2px); }
  .choice-btn:active { transform: translateX(0); }
  .choice-btn:focus-visible,
  .check-item:focus-visible,
  details.field summary:focus-visible {
    outline: 2px solid var(--primary-light);
    outline-offset: 2px;
  }
  .choice-btn.violation:hover { background: var(--accent-bg); border-color: var(--accent-light); }
  .choice-btn.success:hover { background: var(--green-bg); border-color: var(--green); }
  .choice-icon {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--gold);
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-alt);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .choice-btn.violation .choice-icon { color: var(--accent); background: var(--accent-bg); }
  .choice-btn.success .choice-icon { color: var(--green); background: var(--green-bg); }
  .choice-text { flex: 1; min-width: 0; }
  .choice-label {
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: .15rem;
    line-height: 1.35;
  }
  .choice-btn.violation .choice-label { color: var(--accent); }
  .choice-desc {
    font-size: .82rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .choice-arrow {
    color: var(--line);
    font-size: 1.3rem;
    flex-shrink: 0;
    font-family: var(--font-en);
  }

  /* CHECKLIST */
  .checklist { display: flex; flex-direction: column; gap: .5rem; margin: .85rem 0 1rem; }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: .65rem;
    padding: .7rem .85rem;
    background: var(--bg);
    border: 1px solid var(--line-soft);
    border-radius: 5px;
    cursor: pointer;
    transition: all .15s ease;
    user-select: none;
  }
  .check-item:hover { background: var(--bg-alt); border-color: var(--line); }
  .check-item.checked {
    background: var(--green-bg);
    border-color: var(--green);
  }
  .check-item.checked .check-label { color: var(--ink-soft); }
  .check-item.checked .check-label-text { text-decoration: line-through; text-decoration-color: var(--green); }
  .check-box {
    width: 20px;
    height: 20px;
    border: 2px solid var(--line);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    transition: all .15s;
  }
  .check-item.checked .check-box {
    background: var(--green);
    border-color: var(--green);
  }
  .check-item.checked .check-box::after {
    content: '✓';
    color: white;
    font-size: 14px;
    font-weight: 700;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .check-item.shake {
    animation: shake .55s ease;
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .check-label {
    flex: 1;
    font-size: .9rem;
    color: var(--ink);
    line-height: 1.5;
  }
  .check-label-text { display: block; }
  .check-meta {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    margin-top: .35rem;
  }
  .meta-tag {
    display: inline-flex;
    align-items: center;
    gap: .25rem;
    padding: .12rem .5rem;
    border-radius: 3px;
    font-size: .72rem;
    font-family: var(--font-body);
    font-weight: 500;
    line-height: 1.4;
  }
  .meta-tag.form {
    background: var(--bg-alt);
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .meta-tag.law {
    background: var(--primary-bg);
    color: var(--primary);
    border: 1px solid #c5d1e5;
  }
  .meta-tag.warn {
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid var(--accent-light);
  }
  .meta-tag.time {
    background: #fff4d6;
    color: #8a6d1a;
    border: 1px solid #e8d28a;
  }

  /* INFO BOX */
  .info-box {
    background: var(--bg-alt);
    border: 1px dashed var(--line);
    border-radius: 5px;
    padding: .75rem .95rem;
    margin: .85rem 0;
    font-size: .85rem;
    color: var(--ink-soft);
    line-height: 1.55;
  }
  .info-box.warn {
    background: var(--accent-bg);
    border-color: var(--accent-light);
    border-style: solid;
    color: #6b2a2a;
  }
  .info-box.warn strong { color: var(--accent); }
  .info-box-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: .82rem;
    color: var(--primary);
    margin-bottom: .3rem;
    display: block;
  }
  .info-box.warn .info-box-title { color: var(--accent); }
  .info-box ul, .info-box ol { padding-left: 1.1rem; margin: .25rem 0; }
  .info-box li { margin: .15rem 0; }

  /* CRITERIA ACCORDION */
  details.field {
    border: 1px solid var(--line);
    border-radius: 5px;
    margin-bottom: .55rem;
    background: var(--paper);
    overflow: hidden;
  }
  details.field summary {
    padding: .7rem .9rem;
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--primary);
    background: var(--bg-alt);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    font-size: .95rem;
  }
  details.field summary::-webkit-details-marker { display: none; }
  details.field summary::after {
    content: '＋';
    color: var(--gold);
    font-weight: 400;
    font-size: 1.1rem;
    transition: transform .15s;
  }
  details.field[open] summary { background: var(--primary-bg); border-bottom: 1px solid var(--line-soft); }
  details.field[open] summary::after { content: '−'; }
  details.field .field-body {
    padding: .85rem 1rem;
    font-size: .87rem;
    color: var(--ink);
  }
  details.field .field-body h4 {
    font-family: var(--font-display);
    font-size: .85rem;
    color: var(--primary);
    margin: .55rem 0 .3rem;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  details.field .field-body h4:first-child { margin-top: 0; }
  details.field .field-body ol, details.field .field-body ul {
    padding-left: 1.3rem;
    margin: .2rem 0;
  }
  details.field .field-body li { margin: .2rem 0; line-height: 1.55; }
  details.field .field-body li strong { color: var(--primary); }
  details.field .field-body .field-note {
    font-size: .77rem;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: .3rem;
  }
  details.field .field-body .examples {
    font-size: .78rem;
    color: var(--ink-soft);
    background: var(--bg-alt);
    padding: .5rem .7rem;
    border-radius: 4px;
    margin-top: .55rem;
    line-height: 1.55;
  }
  details.field .field-body .examples strong { color: var(--ink); font-weight: 500; }

  /* INPUT FIELDS */
  .input-group { margin: .5rem 0; }
  .input-group label {
    display: block;
    font-size: .82rem;
    color: var(--ink-soft);
    margin-bottom: .25rem;
    font-weight: 500;
  }
  .input-group input, .input-group textarea, .input-group select {
    width: 100%;
    padding: .55rem .75rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: .92rem;
    background: var(--paper);
    color: var(--ink);
  }
  .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 2px var(--primary-bg);
  }
  .input-group textarea { resize: vertical; min-height: 60px; }

  /* NAV BUTTONS */
  .nav-row {
    display: flex;
    gap: .65rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .nav-btn {
    flex: 1;
    min-width: 130px;
    padding: .85rem 1rem;
    border-radius: 5px;
    font-family: var(--font-body);
    font-size: .95rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    min-height: 48px;
  }
  .nav-btn.primary { background: var(--primary); color: #faf5e6; }
  .nav-btn.primary:hover { background: var(--primary-light); transform: translateY(-1px); }
  .nav-btn.violation { background: var(--accent); color: #faf5e6; }
  .nav-btn.violation:hover { background: #6b2a2a; }
  .nav-btn.success { background: var(--green); color: #faf5e6; }
  .nav-btn.success:hover { background: #3a5a2a; }
  .nav-btn.secondary {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--line);
  }
  .nav-btn.secondary:hover { background: var(--primary-bg); }

  /* SUMMARY VIEW */
  .summary-section { margin-bottom: 1.25rem; }
  .summary-section h3 {
    font-family: var(--font-display);
    font-size: .95rem;
    color: var(--primary);
    margin-bottom: .5rem;
    padding-bottom: .25rem;
    border-bottom: 1px solid var(--line-soft);
    font-weight: 600;
  }
  .summary-list { font-size: .88rem; color: var(--ink); }
  .summary-list-item {
    display: flex;
    justify-content: space-between;
    padding: .35rem 0;
    border-bottom: 1px dashed var(--line-soft);
    gap: .5rem;
  }
  .summary-list-item:last-child { border-bottom: none; }
  .summary-key { color: var(--ink-soft); flex-shrink: 0; }
  .summary-val {
    color: var(--ink);
    font-weight: 500;
    text-align: right;
    word-break: break-all;
  }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20,30,50,.55);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 8px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border-top: 4px solid var(--gold);
  }
  .modal-header {
    padding: 1.25rem 1.25rem .75rem;
    border-bottom: 1px solid var(--line-soft);
  }
  .modal-title {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--primary);
    font-size: 1.1rem;
  }
  .modal-body { padding: 1rem 1.25rem; font-size: .9rem; line-height: 1.6; }
  .modal-footer {
    padding: .75rem 1.25rem 1.25rem;
    display: flex;
    gap: .5rem;
    justify-content: flex-end;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--primary);
    color: #faf5e6;
    padding: .75rem 1.25rem;
    border-radius: 5px;
    box-shadow: var(--shadow-lg);
    font-size: .9rem;
    z-index: 150;
    transition: transform .3s ease;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.warn { background: var(--accent); }
  .toast.success { background: var(--green); }

  /* FOOTER */
  .footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: .72rem;
    padding: 1.25rem 1rem 2rem;
    max-width: 720px;
    margin: 0 auto;
    font-family: var(--font-en);
    font-style: italic;
  }
  .app-version {
    margin-top: .5rem;
    font-family: var(--font-body);
    font-style: normal;
    font-size: .68rem;
    letter-spacing: .04em;
    color: var(--line);
  }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    .header { padding: .75rem 1rem .65rem; }
    .title-kor { font-size: .95rem; }
    .title-sub { font-size: .72rem; }
    .header-btn { padding: .35rem .5rem; font-size: .75rem; }
    .container { padding: .85rem 1rem 5rem; }
    .card { padding: 1rem; }
    .card-title { font-size: 1.1rem; }
    .choice-btn { padding: .85rem .95rem; min-height: 58px; }
    .choice-label { font-size: .95rem; }
    .choice-desc { font-size: .78rem; }
    .breadcrumb { font-size: .7rem; padding: .4rem 1rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="title-group">
      <div class="title-kor">검색대 적발 시 절차<span class="title-deco">·</span><span style="font-family:var(--font-en);font-style:italic;font-weight:500;">Detection Protocol</span></div>
      <div class="title-sub">Korea Heritage Service · On-Site Manual</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="resumeBtn" style="display:none;" title="저장된 진행 복구">⟲ 복구</button>

  if (caseState.track) {

  }
}

function loadState() {
  const saved = localStorage.getItem('appraisal_case');
  if (saved) {
    try {
      const obj = JSON.parse(saved);
      if (obj && !obj.checkLabels) obj.checkLabels = {};  // 구버전 저장 호환
      return obj;
    }
    catch(e) { return null; }
  }
  return null;
}

function clearState() {
  localStorage.removeItem('appraisal_case');
  caseState = { startedAt: null, track: null, is_sjp: null, trail: [], checks: {}, checkLabels: {}, inputs: {} };

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => t.classList.remove('show'), 2400);
}

    btn.onclick = b.action || closeModal;
    footer.appendChild(btn);
  });
  document.getElementById('modal').classList.add('active');
}

//   렌더링 헬퍼
// ═══════════════════════════════════════════

function renderChecklist(stateId, items) {
  return `<div class="checklist">${items.map(it => {
    const checkId = `${stateId}.${it.id}`;
    const checked = caseState.checks[checkId] ? 'checked' : '';
    const metaHtml = (it.meta || []).map(m => {
      return `<span class="meta-tag ${m.type}">${m.text}</span>`;
    }).join('');
    return `
      <div class="check-item ${checked}" data-check-id="${checkId}" role="checkbox" aria-checked="${checked ? 'true' : 'false'}" tabindex="0" onclick="toggleCheck('${checkId}', this)" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleCheck('${checkId}', this);}">
        <div class="check-box"></div>
        <div class="check-label">
          <span class="check-label-text">${it.label}</span>
          ${metaHtml ? `<div class="check-meta">${metaHtml}</div>` : ''}
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

// 트랙·특사경·분기 라벨을 한 곳에서 계산 (요약·복사에서 공용)
function computeCaseLabels() {
  const t = caseState.track;
  const trackLabel = t === 'checkpoint' ? '검색대 — 일반동산 적발' : '—';
  const sjpLabel = caseState.is_sjp === true ? '특사경 본인'
                   : caseState.is_sjp === false ? '특사경 부재'
                   : '—';
  const wasRefused = caseState.trail.includes('refuse');
  const wasSeized = caseState.trail.includes('seize_216');
  const wasReleased = caseState.trail.includes('release');
  const wasReleasedRefused = caseState.trail.includes('release_refused');
  const prefix = wasReleasedRefused ? '신청서 거부 → ' : '';
  const branchLabel = wasReleased ? prefix + '비문화유산 판별 · 출국'
                      : wasRefused ? prefix + '전면 거부 · 현행범 검토'
                      : wasSeized ? prefix + '임의제출 거부 · 제216조③ 압수'
                      : caseState.trail.includes('cooperate') ? prefix + '임의제출 동의'
                      : '—';
  return { trackLabel, sjpLabel, branchLabel };
}

function renderSummary() {

  return `

      <div class="summary-section">

        <div class="summary-list">
          <div class="summary-list-item"><span class="summary-key">진입 트랙</span><span class="summary-val">${trackLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">시작 시각</span><span class="summary-val">${startedFmt}</span></div>
          <div class="summary-list-item"><span class="summary-key">특사경 자격</span><span class="summary-val">${sjpLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">분기</span><span class="summary-val">${branchLabel}</span></div>
        </div>
      </div>
      ${inputEntries.length ? `
      <div class="summary-section">
        <h3>입력 항목</h3>
        <div class="summary-list">
          ${inputEntries.map(([k,v]) => `
            <div class="summary-list-item">
              <span class="summary-key">${k}</span>
              <span class="summary-val">${v}</span>
            </div>
          `).join('')}
        </div>
      </div>` : ''}
      <div class="summary-section">
        <h3>완료 항목 (${checkEntries.length}건)</h3>
        <div class="summary-list" style="font-size:.82rem;color:var(--ink-soft);">
          ${checkEntries.length ? checkEntries.map(([k]) => {
            return `<div style="padding:.2rem 0;">✓ ${caseState.checkLabels[k] || k}</div>`;
          }).join('') : '<div style="color:var(--line);font-style:italic;">완료 항목 없음</div>'}
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn secondary" onclick="copyReport()">📋 요약 복사</button>
        <button class="nav-btn primary" onclick="if(confirm('새 사건으로 진행하시겠습니까? 현재 기록은 삭제됩니다.')){clearState();navigate('start');}">새 사건 ›</button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════
//   상태 머신 액션
// ═══════════════════════════════════════════

function renderState(stateId) {
  const state = STATES[stateId];
  if (!state) return;
  document.getElementById('app').innerHTML = state.render();
  renderBreadcrumb(state);
  window.scrollTo(0, 0);
  if (state.onMount) state.onMount();
}

function navigate(stateId) {
  const state = STATES[stateId];
  if (!state) { console.warn('Unknown state:', stateId); return; }

  if (!caseState.startedAt) caseState.startedAt = new Date().toISOString();
  if (state.track && !caseState.track) caseState.track = state.track;

  caseState.trail.push(stateId);
  // 'start' 화면은 진행 시작 전이므로 저장하지 않음 (이전 saved 보존)
  if (stateId !== 'start') saveState();

  renderState(stateId);
}

// 필수 항목 체크 검증 후 진행. 미체크 시 토스트 + 시각 강조
function tryNavigate(targetState, stateId, requiredIds) {
  const missing = requiredIds.filter(id => !caseState.checks[`${stateId}.${id}`]);
  if (missing.length > 0) {
    showToast(`필수 항목 ${missing.length}개를 먼저 체크해 주십시오`, 'warn');
    missing.forEach(id => {
      const el = document.querySelector(`[data-check-id="${stateId}.${id}"]`);
      if (el) {
        el.classList.add('shake');
        setTimeout(() => el.classList.remove('shake'), 700);
      }
    });
    return;
  }
  navigate(targetState);
}

// 특사경 역할 설정 후 진행
function setSjpRole(isSjp) {
  caseState.is_sjp = isSjp;
  navigate('arrival');
}

function goBack() {
  if (caseState.trail.length <= 1) {
    navigate('start');
    return;
  }
  caseState.trail.pop(); // remove current
  const prev = caseState.trail.pop();
  navigate(prev);
}

function renderBreadcrumb(state) {
  const crumb = document.getElementById('breadcrumb');
  const items = state.crumb || ['시작'];
  const trackClass = state.track === 'checkpoint' ? 'violation' : '';
  crumb.innerHTML = items.map((c, i) => {
    if (i === 0) return `<span class="breadcrumb-track ${trackClass}">${c}</span>`;
    const isLast = i === items.length - 1;
    return `<span class="breadcrumb-sep">›</span><span class="breadcrumb-step ${isLast?'current':''}">${c}</span>`;
  }).join('');
}

function toggleCheck(id, el) {
  if (!caseState.checkLabels) caseState.checkLabels = {};
  const now = !caseState.checks[id];
  caseState.checks[id] = now;
  el.classList.toggle('checked', now);
  el.setAttribute('aria-checked', now ? 'true' : 'false');
  // 요약·기록에서 내부 ID 대신 사람이 읽는 라벨이 나오도록 보존
  const labelEl = el.querySelector('.check-label-text');
  if (labelEl) caseState.checkLabels[id] = labelEl.textContent.trim();
  saveState();
}

function copyReport() {
  const { trackLabel, sjpLabel, branchLabel } = computeCaseLabels();

  let txt = `[감정 절차 기록]\n`;
  txt += `진입 트랙: ${trackLabel}\n`;
  txt += `시작 시각: ${fmtTime(caseState.startedAt)}\n`;
  txt += `특사경 자격: ${sjpLabel}\n`;
  txt += `분기: ${branchLabel}\n\n`;

  const checks = Object.entries(caseState.checks).filter(([k,v]) => v);
  if (checks.length) {
    txt += `[완료 항목 ${checks.length}건]\n`;
    checks.forEach(([k]) => { txt += `✓ ${caseState.checkLabels[k] || k}\n`; });
  }
  txt += `\n기록 출력: ${fmtTime(new Date().toISOString())}\n`;

  navigator.clipboard.writeText(txt).then(() => {
    showToast('요약이 클립보드에 복사되었습니다', 'success');
  }).catch(() => {
    showModal('요약', `<pre style="white-space:pre-wrap;font-family:var(--font-body);font-size:.85rem;">${txt}</pre>`);
  });
}

// ═══════════════════════════════════════════
//   초기화
// ═══════════════════════════════════════════

document.getElementById('resetBtn').onclick = () => {
  if (caseState.track && !confirm('진행 중인 사건이 있습니다. 처음으로 돌아가면 삭제됩니다. 계속하시겠습니까?')) return;
  clearState();
  navigate('start');
};

document.getElementById('resumeBtn').onclick = () => {
  const saved = loadState();
  if (saved && saved.trail && saved.trail.length > 1) {
    caseState = saved;
    const lastState = saved.trail[saved.trail.length - 1];
    renderState(lastState);
    showToast('이전 진행 상태를 복구했습니다', 'success');
  } else {
    showToast('복구할 진행 상태가 없습니다', 'warn');
  }
};

// 모달 배경 클릭 시 닫기
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// Esc 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// 시작
(function init() {
  const saved = loadState();
  // 진행 중인 사건이 있을 때만(start 외에 다른 화면을 거친 경우) 복구 버튼 표시
  if (saved && saved.trail && saved.trail.length > 1) {
    document.getElementById('resumeBtn').style.display = '';
  }
  navigate('start');
})();
</script>

</body>
</html>
