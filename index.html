<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="검색대 적발">
<title>검색대 적발 시 절차</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%231F4E79'/><text x='32' y='46' font-size='38' fill='%23D9A43B' text-anchor='middle' font-family='serif' font-weight='600'>規</text></svg>">

<style>
/* =====================================================================
   heritage-design.css — 한재원 문화유산 교육·학술 디자인 시스템 (오방색)
   단일 HTML 배포 원칙에 따라 원본 CSS 전문을 이 블록에 내장함.
   시스템이 갱신되면 '── 앱 화면 스타일 ──' 이전 부분을 통째로 교체할 것.
   (서체 예외: 미설치 기기·오프라인 대응을 위해 웹폰트 대신
    기기 기본 글꼴 스택을 사용함 — heritage-guide와 동일한 결정)
   ===================================================================== */

/* ── 토큰 ── */
:root {
  /* 오방 기본색 */
  --obang-cheong: #1F4E79; /* 청(쪽빛) — 구조·질서 */
  --obang-jeok: #A63C32;   /* 적(석간주) — 경계·금지 */
  --obang-hwang: #D9A43B;  /* 황(치자) — 중심·핵심 */
  --obang-baek: #FAF7F0;   /* 백(소색 한지) — 바탕 */
  --obang-heuk: #221E1A;   /* 흑(먹) — 텍스트 */
  --obang-nok: #3F6B51;    /* 뇌록 — 긍정·확인 */

  /* 표면 */
  --surface-canvas: #FAF7F0; /* 페이지 바탕 — 순백 #FFF 금지 */
  --surface-soft: #F3EEE3;   /* 카드·박스 채움 */
  --surface-card: #ECE5D6;   /* 가라앉은 카드 */
  --hairline: #E3DBC9;       /* 1px 경계선 */

  /* 텍스트 */
  --text-ink: #221E1A;
  --text-body: #3D3831;
  --text-muted: #6F675B;
  --text-muted-soft: #948B7D;
  --on-dark: #FAF7F0;       /* 어두운 면 위 주 텍스트 */
  --on-dark-soft: #B9C9D8;  /* 어두운 면 위 보조(회청) */
  --on-hwang: #221E1A;      /* 황 면 위 텍스트 */

  /* 의미 별칭 */
  --accent-structure: var(--obang-cheong); /* 구조: 헤더·주 버튼·기본 띠 */
  --accent-center: var(--obang-hwang);     /* 핵심: 화면당 채움 1회 */
  --accent-warning: var(--obang-jeok);     /* 주의·오류 전용 */
  --accent-positive: var(--obang-nok);     /* 확인·긍정 전용 */

  /* 서체 — 기기 기본 글꼴 스택 (웹폰트 미사용: 미설치 기기·오프라인 대응) */
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;
  --font-display: var(--font-body); /* 제목·인용 — 굵기로만 위계 구분 */

  /* 여백·형태 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --radius: 0; /* 모든 모서리 직각 — 원형은 번호 배지만 예외 */

  /* 구 토큰 호환 별칭 — 본문 인라인 스타일이 참조 (전부 시스템 토큰으로 연결) */
  --ink-soft: var(--text-muted);
  --accent: var(--accent-warning);
  --line: var(--hairline);
  --line-soft: var(--hairline);
  --gold: var(--obang-hwang);
  --gold-soft: var(--obang-hwang);
  --primary: var(--accent-structure);
  --bg-alt: var(--surface-card);
  --font-en: var(--font-body);
}

/* ── 베이스 ── */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body.heritage {
  margin: 0; background: var(--surface-canvas); color: var(--text-body);
  font-family: var(--font-body); font-size: 14px; line-height: 1.65;
  min-height: 100vh; overscroll-behavior-y: contain;
}
.heritage h1, .heritage h2, .heritage h3 {
  font-family: var(--font-display); font-weight: 800; color: var(--text-ink);
  letter-spacing: -0.02em; line-height: 1.3; margin: 0;
}
.heritage a { color: var(--accent-structure); }
.heritage a:hover { color: var(--obang-cheong); text-decoration: underline; text-underline-offset: 3px; }
.heritage :focus-visible { outline: 2px solid var(--accent-structure); outline-offset: 2px; }

/* ── 헤더 바 (쪽빛 단일 평면 — 그라데이션 금지) ── */
.h-header {
  background: var(--accent-structure); color: var(--on-dark);
  display: flex; align-items: baseline; gap: 12px; padding: 13px 20px;
}
.h-header .h-brand { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: 4px; }
.h-header .h-sub { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--on-dark-soft); }

/* ── 카드/박스: 한지 채움 + 1px 경계 + 좌측 4px 의미색 띠. 그림자 없음 ── */
.h-box { background: var(--surface-soft); border: 1px solid var(--hairline); border-left: 4px solid var(--accent-structure); padding: 16px 18px; }
.h-box--warning { border-left-color: var(--accent-warning); }
.h-box--positive { border-left-color: var(--accent-positive); }
.h-box--center { border-left-color: var(--accent-center); }

/* ── 버튼 ── */
.h-btn {
  font-family: inherit; cursor: pointer; border: none; border-radius: 0;
  background: var(--accent-structure); color: var(--on-dark);
  padding: 10px 30px; font-size: 14px; font-weight: 700; letter-spacing: 3px;
}
.h-btn:hover { background: #1A4066; }
.h-btn:disabled { opacity: 0.45; cursor: default; }
.h-btn--ghost { background: var(--surface-canvas); border: 1px solid var(--accent-structure); color: var(--accent-structure); }
.h-btn--ghost:hover { background: var(--surface-soft); }
.h-btn--text { background: none; padding: 2px 0; color: var(--accent-structure); font-size: 12.5px; letter-spacing: 0.5px; }

/* ── 태그·칩 (1px 테두리, 직각) ── */
.h-tag { font-size: 12px; border: 1px solid var(--hairline); color: var(--text-muted); padding: 2px 7px; background: var(--surface-canvas); letter-spacing: 1px; }
.h-tag--primary { border-color: var(--accent-structure); color: var(--accent-structure); }

/* ── 번호 배지 (원형 예외) ── */
.h-badge {
  width: 44px; height: 44px; border-radius: 999px; background: var(--accent-structure);
  color: var(--on-dark); display: inline-flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
}

/* ── 색동 구분선 — 표지·마무리 화면에만 ── */
.h-saekdong { display: flex; gap: 8px; }
.h-saekdong span { width: 34px; height: 5px; }
.h-saekdong span:nth-child(1) { background: var(--obang-cheong); }
.h-saekdong span:nth-child(2) { background: var(--obang-jeok); }
.h-saekdong span:nth-child(3) { background: var(--obang-hwang); }
.h-saekdong span:nth-child(4) { background: var(--obang-heuk); }

/* ── 로딩: 황 점 3개 깜빡임 (허용된 유일한 모션) ── */
.h-dots { display: inline-flex; gap: 7px; }
.h-dots span { width: 7px; height: 7px; background: var(--accent-center); animation: h-blink 1.05s infinite; }
.h-dots span:nth-child(2) { animation-delay: 0.18s; }
.h-dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes h-blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .h-dots span { animation: none; opacity: 0.8; } }

/* =====================================================================
   ── 앱 화면 스타일 — 위 시스템의 토큰·클래스만 사용 ──
   규칙 준수 메모:
   · 평면·직각·무그림자. 전환·변형 모션 없음 (필수 미체크 강조도 정적 색 강조)
   · 적은 경계·금지 전용(위반 트랙·경고 박스·필수 태그), 뇌록은 완료 체크 전용
   · 황 채움 없음(띠·색동만 사용) — 화면당 1회 한도 내
   · 색동 구분선은 표지(시작 화면)와 푸터에만
   ===================================================================== */

/* HEADER */
.h-header {
  position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 12px max(16px, calc((100% - 720px) / 2));
}
.h-header .h-brand { font-family: "TitleMaru", var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 2px; }
.h-header .h-sub { letter-spacing: 1.5px; }
.header-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.header-btn {
  background: transparent; border: 1px solid var(--on-dark-soft); color: var(--on-dark);
  padding: 6px 10px; border-radius: 0; font-family: var(--font-body);
  font-size: 12.5px; font-weight: 700; cursor: pointer; min-height: 36px;
  display: inline-flex; align-items: center; gap: 4px;
}
.header-btn:hover { background: #1A4066; }
.header-btn.danger:hover { background: var(--accent-warning); border-color: var(--accent-warning); }

/* BREADCRUMB */
.breadcrumb {
  background: var(--surface-canvas); border-bottom: 1px solid var(--hairline);
  padding: 7px max(16px, calc((100% - 720px) / 2));
  font-size: 12px; color: var(--text-muted);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 32px;
}
.breadcrumb-track { font-weight: 800; letter-spacing: 1.5px; font-size: 12.5px; text-transform: uppercase; color: var(--accent-structure); }
.breadcrumb-track.violation { color: var(--accent-warning); }
.breadcrumb-sep { color: var(--text-muted-soft); }
.breadcrumb-step { color: var(--text-muted); }
.breadcrumb-step.current { color: var(--text-ink); font-weight: 700; }

/* MAIN */
.container { max-width: 720px; margin: 0 auto; padding: 18px 16px 72px; }

/* CARDS — h-box 문법 */
.card {
  background: var(--surface-soft); border: 1px solid var(--hairline);
  border-left: 4px solid var(--accent-structure);
  padding: 18px; margin-bottom: 16px;
}
.card.accent { border-left-color: var(--accent-center); }
.card.violation { border-left-color: var(--accent-warning); }
.card.success { border-left-color: var(--accent-positive); }
.card.info { border-left-color: var(--accent-structure); }

.card-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 9px;
  border-bottom: 1px solid var(--hairline);
}
.card-step { font-size: 12.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-structure); }
.card-step.violation { color: var(--accent-warning); }
.card-title { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--text-ink); line-height: 1.4; margin-bottom: 12px; word-break: keep-all; }
.card-title.violation { color: var(--accent-warning); }
.card-desc { color: var(--text-body); font-size: .92rem; line-height: 1.65; margin-bottom: 14px; word-break: keep-all; }
.card-desc strong { color: var(--text-ink); font-weight: 700; }

/* CHOICE BUTTONS */
.choice-grid { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  text-align: left; background: var(--surface-canvas);
  border: 1px solid var(--hairline); border-radius: 0;
  padding: 13px 14px; cursor: pointer; font-family: var(--font-body); color: var(--text-ink);
  display: flex; align-items: center; gap: 12px; min-height: 60px; width: 100%;
}
.choice-btn:hover { border-color: var(--accent-structure); }
.choice-btn.violation:hover { border-color: var(--accent-warning); }
.choice-btn.success:hover { border-color: var(--accent-positive); }
.choice-icon {
  font-family: var(--font-display); font-weight: 800; font-size: 1.05rem;
  color: var(--on-dark); width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-structure); border-radius: 999px; /* 원형 배지 예외 */
  flex-shrink: 0;
}
.choice-btn.violation .choice-icon { background: var(--accent-warning); }
.choice-btn.success .choice-icon { background: var(--accent-positive); }
.choice-text { flex: 1; min-width: 0; }
.choice-label { font-family: var(--font-display); font-size: .98rem; font-weight: 800; color: var(--text-ink); margin-bottom: 2px; line-height: 1.35; word-break: keep-all; }
.choice-btn.violation .choice-label { color: var(--accent-warning); }
.choice-desc { font-size: .8rem; color: var(--text-muted); line-height: 1.45; word-break: keep-all; }
.choice-arrow { color: var(--text-muted-soft); font-size: 1.2rem; flex-shrink: 0; }

/* CHECKLIST */
.checklist { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 14px; }
.check-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  background: var(--surface-canvas); border: 1px solid var(--hairline); border-radius: 0;
  cursor: pointer; user-select: none;
}
.check-item:hover { border-color: var(--accent-structure); }
.check-item.checked { background: var(--surface-card); border-color: var(--accent-positive); }
.check-item.checked .check-label { color: var(--text-muted); }
.check-item.checked .check-label-text { text-decoration: line-through; text-decoration-color: var(--accent-positive); }
.check-box {
  width: 19px; height: 19px; border: 2px solid var(--hairline); border-radius: 0;
  flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
  background: var(--surface-canvas);
}
.check-item.checked .check-box { background: var(--accent-positive); border-color: var(--accent-positive); }
.check-item.checked .check-box::after { content: '✓'; color: var(--on-dark); font-size: 13px; font-weight: 700; }
/* 필수 미체크 강조 — 규칙 6에 따라 모션 없이 정적 색 강조 */
.check-item.miss { border-color: var(--accent-warning); background: var(--surface-card); }
.check-item.miss .check-box { border-color: var(--accent-warning); }
.check-label { flex: 1; font-size: .88rem; color: var(--text-ink); line-height: 1.5; word-break: keep-all; }
.check-label-text { display: block; }
.check-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

/* 메타 태그 — h-tag 문법 */
.meta-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
  border-radius: 0; font-size: 12px; font-weight: 700; letter-spacing: .5px; line-height: 1.5;
  background: var(--surface-canvas); border: 1px solid var(--hairline); color: var(--text-muted);
}
.meta-tag.law { border-color: var(--accent-structure); color: var(--accent-structure); }
.meta-tag.warn { border-color: var(--accent-warning); color: var(--accent-warning); }
.meta-tag.time { border-color: var(--accent-center); color: var(--text-muted); }

/* INFO BOX */
.info-box {
  background: var(--surface-card); border: 1px solid var(--hairline);
  border-left: 4px solid var(--accent-structure); border-radius: 0;
  padding: 12px 14px; margin: 14px 0; font-size: .85rem; color: var(--text-body);
  line-height: 1.6; word-break: keep-all;
}
.info-box.warn { border-left-color: var(--accent-warning); }
.info-box.warn strong { color: var(--accent-warning); }
.info-box-title { font-family: var(--font-display); font-weight: 800; font-size: .8rem; color: var(--accent-structure); margin-bottom: 5px; display: block; }
.info-box.warn .info-box-title { color: var(--accent-warning); }
.info-box ul, .info-box ol { padding-left: 1.1rem; margin: .25rem 0; }
.info-box li { margin: .15rem 0; }

/* CRITERIA ACCORDION */
details.field { border: 1px solid var(--hairline); border-radius: 0; margin-bottom: 8px; background: var(--surface-canvas); }
details.field summary {
  padding: 10px 13px; cursor: pointer; font-family: var(--font-display); font-weight: 800;
  color: var(--text-ink); background: var(--surface-card); list-style: none;
  display: flex; justify-content: space-between; align-items: center; user-select: none;
  font-size: .92rem; word-break: keep-all;
}
details.field summary::-webkit-details-marker { display: none; }
details.field summary::after { content: '＋'; color: var(--accent-structure); font-weight: 400; font-size: 1.05rem; }
details.field[open] summary { border-bottom: 1px solid var(--hairline); }
details.field[open] summary::after { content: '−'; }
details.field .field-body { padding: 12px 14px; font-size: .86rem; color: var(--text-body); }
details.field .field-body h4 { font-family: var(--font-display); font-size: .84rem; color: var(--accent-structure); margin: .6rem 0 .3rem; font-weight: 800; }
details.field .field-body h4:first-child { margin-top: 0; }
details.field .field-body ol, details.field .field-body ul { padding-left: 1.3rem; margin: .2rem 0; }
details.field .field-body li { margin: .2rem 0; line-height: 1.55; }
details.field .field-body li strong { color: var(--text-ink); }
details.field .field-body .field-note { font-size: .77rem; color: var(--text-muted); margin-top: .35rem; }
details.field .field-body .examples {
  font-size: .78rem; color: var(--text-muted); background: var(--surface-card);
  border: 1px solid var(--hairline); padding: 8px 11px; margin-top: .55rem; line-height: 1.55;
}
details.field .field-body .examples strong { color: var(--text-ink); font-weight: 700; }

/* NAV BUTTONS */
.nav-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.nav-btn {
  flex: 1; min-width: 130px; padding: 12px 16px; border-radius: 0;
  font-family: var(--font-body); font-size: .92rem; font-weight: 700; letter-spacing: 1px;
  cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; min-height: 48px;
}
.nav-btn.primary { background: var(--accent-structure); color: var(--on-dark); }
.nav-btn.primary:hover { background: #1A4066; }
.nav-btn.violation { background: var(--accent-warning); color: var(--on-dark); }
.nav-btn.success { background: var(--accent-positive); color: var(--on-dark); }
.nav-btn.secondary { background: var(--surface-canvas); color: var(--accent-structure); border: 1px solid var(--accent-structure); }
.nav-btn.secondary:hover { background: var(--surface-soft); }

/* SUMMARY VIEW */
.summary-section { margin-bottom: 18px; }
.summary-section h3 {
  font-family: var(--font-display); font-size: .92rem; font-weight: 800; color: var(--text-ink);
  margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--hairline);
}
.summary-list { font-size: .88rem; color: var(--text-ink); }
.summary-list-item { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--hairline); }
.summary-list-item:last-child { border-bottom: none; }
.summary-key { color: var(--text-muted); flex-shrink: 0; }
.summary-val { color: var(--text-ink); font-weight: 700; text-align: right; word-break: break-all; }
.summary-check { display: flex; gap: 10px; padding: 4px 0; line-height: 1.5; word-break: keep-all; }
.summary-time { flex-shrink: 0; min-width: 3.1em; font-weight: 700; color: var(--text-ink); font-variant-numeric: tabular-nums; }
.summary-offpath { color: var(--text-muted-soft); }

/* MODAL — 직각·무그림자 */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(34, 30, 26, .55); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-backdrop.active { display: flex; }
.modal {
  background: var(--surface-canvas); border: 1px solid var(--hairline);
  border-top: 4px solid var(--accent-structure); border-radius: 0;
  max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto;
}
.modal-header { padding: 16px 18px 10px; border-bottom: 1px solid var(--hairline); }
.modal-title { font-family: var(--font-display); font-weight: 800; color: var(--text-ink); font-size: 1.05rem; }
.modal-body { padding: 14px 18px; font-size: .9rem; line-height: 1.6; }
.modal-footer { padding: 10px 18px 18px; display: flex; gap: 8px; justify-content: flex-end; }

/* TOAST — 모션 없이 즉시 표시 */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  display: none; background: var(--surface-soft); border: 1px solid var(--hairline);
  border-left: 4px solid var(--accent-structure); border-radius: 0;
  color: var(--text-body); padding: 10px 16px; font-size: .88rem;
  z-index: 150; max-width: 90vw; text-align: center;
}
.toast.show { display: block; }
.toast.warn { border-left-color: var(--accent-warning); }
.toast.success { border-left-color: var(--accent-positive); }

/* FOOTER — 색동 구분선 (마무리 허용 지점) */
.footer { text-align: center; color: var(--text-muted); font-size: .75rem; padding: 8px 16px 36px; max-width: 720px; margin: 0 auto; line-height: 1.7; }
.footer .h-saekdong { justify-content: center; margin: 0 auto 14px; width: max-content; }
.app-version { margin-top: 8px; font-size: .75rem; letter-spacing: 1px; color: var(--text-muted-soft); }

/* 표지(시작 화면) 색동 */
.h-saekdong.cover { justify-content: center; margin: 4px auto 16px; width: max-content; }

/* RESPONSIVE */
@media (max-width: 480px) {
  .h-header .h-brand { font-size: 18px; letter-spacing: 1px; }
  .h-header .h-sub { display: none; }
  .container { padding: 14px 12px 72px; }
  .card { padding: 14px; }
  .card-title { font-size: 1.05rem; }
  .choice-btn { padding: 11px 12px; min-height: 56px; }
  .choice-label { font-size: .93rem; }
  .choice-desc { font-size: .8rem; }
}

/* 터치 기기 — hover 잔상 제거 */
@media (hover: none) {
  .choice-btn:hover, .choice-btn.violation:hover, .choice-btn.success:hover,
  .check-item:hover { border-color: var(--hairline); }
  .nav-btn.primary:hover { background: var(--accent-structure); }
  .nav-btn.secondary:hover { background: var(--surface-canvas); }
  .h-btn:hover { background: var(--accent-structure); }
  .header-btn:hover, .header-btn.danger:hover { background: transparent; border-color: var(--on-dark-soft); }
}

/* 스크롤바 — 직각, 시스템 색 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--surface-soft); }
::-webkit-scrollbar-thumb { background: var(--hairline); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted-soft); }

/* =====================================================================
   규칙 요약 (코드 리뷰용 — heritage-design.css 원문)
   1. 페이지 배경은 항상 --surface-canvas. 순백 #FFF 금지.
   2. 모든 모서리 직각. 그라데이션·그림자·블러 금지 — 평면과 1px 선만.
   3. 황(치자) 채움은 화면당 1회.
   4. 적(석간주)은 경계·금지·오류에만, 뇌록은 긍정·확인에만.
   5. 색동 구분선은 표지(빈 상태)·마무리(푸터)에만.
   6. hover=색 심화·밑줄 / focus=청 2px outline / 로딩=황 점 3개. 그 외 모션 없음.
   7. 제목=나눔명조 800, 본문·UI=나눔고딕. 본문 행간 1.6~1.75.
      (7조 서체는 미설치 기기·오프라인 대응을 위해 기기 기본 글꼴로 대체 적용)
   ===================================================================== */
</style>
</head>
<body class="heritage">

<header class="h-header">
  <div class="h-brand">검색대 적발 시 절차</div>
  <div class="h-sub">KOREA HERITAGE SERVICE · ON-SITE MANUAL</div>
  <div class="header-actions">
    <button class="header-btn" id="resumeBtn" style="display:none;" title="저장된 진행 복구">⟲ 복구</button>
    <button class="header-btn danger" id="resetBtn" title="처음으로">⌂ 처음</button>
  </div>
</header>

<div class="breadcrumb" id="breadcrumb">
  <span class="breadcrumb-track">시작</span>
</div>

<main class="container" id="app"></main>

<div class="footer">
  <div class="h-saekdong" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  Reference · 문화유산법 제39·60·90조 · 형소법 제211·212·216·218조 · 특사경 협력규정 · 감정관실 설치·운영 규정
  <div class="app-version" id="appVersion"></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

// ────────────────────────────────────────────────
//  ▼ 배포할 때마다 이 한 줄만 바꾸세요. 화면 맨 아래에 그대로 표시됩니다.
const APP_VERSION = 'v3.8 · 2026-11-12';
// ────────────────────────────────────────────────
(function () {
  const v = document.getElementById('appVersion');
  if (v) v.textContent = APP_VERSION;
})();

// ===== 케이스 상태 =====
let caseState = {
  startedAt: null,
  track: null,        // 'checkpoint'
  is_sjp: null,       // true: 특사경 본인 현장 / false: 부재
  trail: [],          // 경로 기록
  checks: {},         // { 'state.checkid': true/false }
  checkLabels: {},    // { 'state.checkid': '사람이 읽는 라벨' }
  checkTimes: {},     // { 'state.checkid': 체크한 시각(ISO) } — 경위서 작성용
  inputs: {},         // 자유 입력값
};

function saveState() {
  if (!caseState.track) return;
  try { localStorage.setItem('appraisal_case', JSON.stringify(caseState)); }
  catch (e) { /* 사생활 보호 모드 등 저장 불가 — 진행 자체는 계속 */ }
}

function loadState() {
  let saved = null;
  try { saved = localStorage.getItem('appraisal_case'); } catch (e) { return null; }
  if (saved) {
    try {
      const obj = JSON.parse(saved);
      if (obj && !obj.checkLabels) obj.checkLabels = {};  // 구버전 저장 호환
      if (obj && !obj.checkTimes) obj.checkTimes = {};
      if (obj && !obj.checks) obj.checks = {};
      return obj;
    }
    catch(e) { return null; }
  }
  return null;
}

// 이 기기에 남아 있는 '다른' 진행 중 사건 (지금 화면의 사건과 시작 시각이 다른 것)
function resumableCase() {
  const saved = loadState();
  if (!saved || !saved.trail || saved.trail.length <= 1) return null;
  if (saved.startedAt && saved.startedAt === caseState.startedAt) return null;
  return saved;
}

function clearState() {
  try { localStorage.removeItem('appraisal_case'); } catch (e) {}
  caseState = { startedAt: null, track: null, is_sjp: null, trail: [], checks: {}, checkLabels: {}, checkTimes: {}, inputs: {} };
}

// ===== 유틸 =====
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtClock(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);   // 연달아 띄울 때 앞선 타이머가 새 안내를 일찍 지우지 않게
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function showModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const footer = document.getElementById('modalFooter');
  footer.innerHTML = '';
  (buttons || [{label:'닫기', className:'nav-btn secondary', action:closeModal}]).forEach(b => {
    const btn = document.createElement('button');
    btn.className = b.className || 'nav-btn primary';
    btn.textContent = b.label;
    btn.onclick = b.action || closeModal;
    footer.appendChild(btn);
  });
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// ===== 상태 정의 =====
const STATES = {

  // ─── 시작 — 일반동산문화유산 판단 기준 ───
  start: {
    track: 'checkpoint',
    crumb: ['시작'],
    render: () => `
      <div class="h-saekdong cover" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      ${renderResumeCard()}
      <div class="card">
        <div class="card-meta"><span class="card-step">검색대 적발 절차</span></div>
        <h2 class="card-title">현장 특사경 자격 확인</h2>
        <p class="card-desc">현장의 특별사법경찰(특사경) 자격 여부를 선택하면 그에 맞는 절차로 진행됩니다.</p>
        <div class="choice-grid">
          <button class="choice-btn" onclick="setSjpRole(true)">
            <span class="choice-icon">特</span>
            <span class="choice-text">
              <span class="choice-label">특사경(특별사법경찰관) 위원 현장</span>
              <span class="choice-desc">본인이 직접 임의제출·인계 진행 가능</span>
            </span>
            <span class="choice-arrow">›</span>
          </button>
          <button class="choice-btn" onclick="setSjpRole(false)">
            <span class="choice-icon">非</span>
            <span class="choice-text">
              <span class="choice-label">특사경 자격 위원 부재</span>
              <span class="choice-desc">사범단속팀 호출 또는 경찰 신고 필요</span>
            </span>
            <span class="choice-arrow">›</span>
          </button>
        </div>
        <div class="info-box" style="font-size:.82rem;">
          여기서 '특사경 자격'은 <strong>특별사법경찰관</strong> 지명을 말합니다. 영장 없는 압수(형소법 제216조③·제218조)와 피의자 신문의 주체는 특별사법경찰관이며, 특별사법경찰리는 수사를 보조합니다. 특별사법경찰리만 현장에 있으면 '부재'로 진행하십시오. 지명 여부·직위·담당 범죄는 미리 확인해 두고, 서류에는 직위를 명확히 적습니다.
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">일반동산문화유산 해당 기준</h2>
        <p class="card-desc">시행령 별표 3(2024. 7. 23. 개정) 기준입니다. 분야별로 공통기준을 모두 충족하고 추가기준 중 하나 이상을 충족하면 일반동산문화유산으로 봅니다.</p>

        <details class="field">
          <summary>1. 미술 분야</summary>
          <div class="field-body">

          임의제출 없이 특사경이 직접 압수했다면 이것도 <strong>영장 없는 압수</strong>입니다. 범죄장소 긴급 압수(형소법 제216조 ③)라면 지체 없이 사후 영장을 받아야 하고, 현행범 체포 현장에서 압수했다면(제216조 ① 2호) 계속 압수할 필요가 있을 때 <strong>체포한 때부터 48시간 이내에 영장이 청구</strong>되어야 하므로(제217조 ②) 그 전에 검사에게 신청합니다. 영장을 받지 못하면 압수물을 즉시 반환해야 합니다(제217조 ③). 사범단속팀·경찰에 인계할 때 <strong>압수 근거와 체포·압수 시각</strong>을 함께 넘깁니다.
        </div>
        ` : ''}

        <div class="info-box">
          <span class="info-box-title">정밀 사진 촬영 권장 포인트</span>
          <ul style="padding-left:1.1rem;margin:.25rem 0;">
            <li>정면·측면·바닥(굽 포함)·세부 문양·명문·관지</li>
            <li>스케일바 또는 자 동시 촬영 (크기 검증용)</li>
            <li>균열·결손·수리 흔적 등 보존 상태 기록</li>
            <li>고해상도 원본 보관 (감정조서·인계 자료 활용)</li>
          </ul>
        </div>

        ${caseState.is_sjp ? `
        <div class="info-box warn">
          <span class="info-box-title">특사경 본인 — 추가 수사 절차</span>
          본인이 특사경 자격으로 수사를 직접 개시하는 경우 다음을 함께 진행합니다.
          <ul style="padding-left:1.1rem;margin:.4rem 0;">
            <li><strong>범죄인지보고서</strong> 작성 · 범죄사건부 등재 (특사경 직무규정 제14조① · 별지 제2호 서식). 직무규정 서식은 개정 특사경 협력규칙의 법정 서식과 대조해 필수 항목이 빠지지 않게 합니다.</li>
            <li>수사개시 즉시 검사 통보(특사경 협력규정 제15조)는 열거된 중대범죄에 한하며 문화유산법 위반은 열거되어 있지 않습니다. 다만 관세법 위반이 함께 문제되면 같은 조의 통보 대상이 될 수 있으므로 확인합니다.</li>
            <li>피의자 본인 확인 — 신분증 사본 복사 후 수사기록 편철</li>
            <li>피의자 신문 전 <strong>진술거부권·변호인 조력권·검사 구제신청권</strong> 고지 (자필 확인). 서명만 받는 절차가 아니므로 내용을 이해시킵니다. 변호인을 선임하겠다고 하면 선임 기한과 다음 조사 일정을 정해 귀가시킨 뒤 조사합니다.</li>
            <li>조사는 원칙적으로 <strong>오후 9시~다음 날 오전 6시</strong>에 하지 않고, 대기·휴식 포함 <strong>12시간</strong>을 넘기지 않습니다. 야간 출국편 사건이라도 예외 사유가 없으면 신문을 미루고, 예외로 조사했다면 그 사유를 수사보고로 남깁니다.</li>
            <li>조서·수사보고 등 모든 서류에 작성 연월일, 소속, 직위(특별사법경찰관)를 적고 서명날인합니다.</li>
          </ul>
          이러한 절차는 압수·인수 후 사범단속팀과 협의하여 진행하며, 인계 시 함께 송부합니다. 특사경 사건은 혐의가 없다고 보더라도 자체 종결하지 않고 <strong>모두 검사에게 송치</strong>합니다 (형소법 제245조의10⑤).
        </div>
        ` : ''}

        <div class="nav-row">
          <button class="nav-btn secondary" onclick="goBack()">‹ 뒤로</button>
          <button class="nav-btn primary" onclick="tryNavigate('summary', 'office_followup', ${JSON.stringify(requiredIds).replace(/"/g, '&quot;')})">완료 ›</button>
        </div>
      </div>
      `;
    }
  },

  // ─── 요약 ───
  summary: {
    track: null,
    crumb: ['요약'],
    render: () => renderSummary()
  }
};

// ═══════════════════════════════════════════
//   렌더링 헬퍼
// ═══════════════════════════════════════════

function renderChecklist(stateId, items) {
  return `<div class="checklist">${items.map(it => {
    const checkId = `${stateId}.${it.id}`;
    const checked = caseState.checks[checkId] ? 'checked' : '';
    const metaHtml = (it.meta || []).map(m => {
      return `<span class="meta-tag ${m.type}">${m.text}</span>`;
    }).join('');
    return `
      <div class="check-item ${checked}" data-check-id="${checkId}" role="checkbox" aria-checked="${checked ? 'true' : 'false'}" tabindex="0" onclick="toggleCheck('${checkId}', this)" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleCheck('${checkId}', this);}">
        <div class="check-box"></div>
        <div class="check-label">
          <span class="check-label-text">${it.label}</span>
          ${metaHtml ? `<div class="check-meta">${metaHtml}</div>` : ''}
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

// 트랙·특사경·분기 라벨을 한 곳에서 계산 (요약·복사에서 공용)
function computeCaseLabels() {
  const t = caseState.track;
  const trackLabel = t === 'checkpoint' ? '검색대 — 일반동산 적발' : '—';
  const sjpLabel = caseState.is_sjp === true ? '특사경 본인'
                   : caseState.is_sjp === false ? '특사경 부재'
                   : '—';
  const wasRefused = caseState.trail.includes('refuse');
  const wasSeized = caseState.trail.includes('seize_216');
  const wasReleased = caseState.trail.includes('release');
  const wasReleasedRefused = caseState.trail.includes('release_refused');
  const prefix = wasReleasedRefused ? '신청서 거부 → ' : '';
  const branchLabel = wasReleased ? prefix + '비문화유산 판별 · 출국'
                      : wasRefused ? prefix + '전면 거부 · 현행범 검토'
                      : wasSeized ? prefix + '임의제출 거부 · 제216조③ 압수'
                      : caseState.trail.includes('cooperate') ? prefix + '임의제출 동의'
                      : '—';
  return { trackLabel, sjpLabel, branchLabel };
}

// 체크리스트 키 → 그 체크리스트가 놓인 화면
const CHECKLIST_SCREEN = { cooperate_optional: 'cooperate', refuse_sjp: 'refuse', refuse_nonsjp: 'refuse' };

// 완료 항목을 체크한 시각순으로. 되돌아가 버린 분기에서 체크한 것은 지우지 않고 표시만 구분
function collectChecks() {
  const times = caseState.checkTimes || {};
  return Object.keys(caseState.checks).filter(k => caseState.checks[k]).map((k, i) => {
    const group = k.split('.')[0];
    const screen = CHECKLIST_SCREEN[group] || group;
    return { key: k, order: i, time: times[k] || '', label: caseState.checkLabels[k] || k, onPath: caseState.trail.includes(screen) };
  }).sort((a, b) => (a.time && b.time) ? (a.time < b.time ? -1 : a.time > b.time ? 1 : a.order - b.order) : a.order - b.order);
}

// 거쳐 온 화면 이름 (시작·요약 제외)
function pathLabel() {
  const names = caseState.trail.filter(id => id !== 'start' && id !== 'summary' && STATES[id])
    .map(id => { const c = STATES[id].crumb; return c[c.length - 1]; });
  return names.length ? names.join(' → ') : '—';
}

function renderResumeCard() {
  const saved = resumableCase();
  if (!saved) return '';
  const last = STATES[saved.trail[saved.trail.length - 1]];
  const where = last ? last.crumb.join(' › ') : '—';
  const done = Object.values(saved.checks || {}).filter(Boolean).length;
  return `
      <div class="card accent">
        <div class="card-meta">
          <span class="card-step">진행 중인 사건</span>
          <span style="font-size:.78rem;color:var(--text-muted);">${saved.startedAt ? '시작 ' + fmtTime(saved.startedAt) : ''}</span>
        </div>
        <h2 class="card-title">이어서 진행하시겠습니까?</h2>
        <p class="card-desc">이 기기에 저장된 사건이 있습니다. 마지막 화면은 <strong>${where}</strong>, 체크한 항목은 ${done}건입니다.</p>
        <div class="nav-row" style="margin-top:0;">
          <button class="nav-btn primary" onclick="resumeCase()">이어서 하기 ›</button>
          <button class="nav-btn secondary" onclick="discardSaved()">지우고 새로 시작</button>
        </div>
      </div>`;
}

function renderSummary() {
  const { trackLabel, sjpLabel, branchLabel } = computeCaseLabels();
  const startedFmt = caseState.startedAt ? fmtTime(caseState.startedAt) : '—';

  const checkEntries = collectChecks();
  const hasOffPath = checkEntries.some(e => !e.onPath);

  return `
    <div class="card accent">
      <div class="card-meta"><span class="card-step">진행 완료</span></div>
      <h2 class="card-title">사건 진행 요약</h2>
      <div class="summary-section">
        <h3>기본 정보</h3>
        <div class="summary-list">
          <div class="summary-list-item"><span class="summary-key">진입 트랙</span><span class="summary-val">${trackLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">시작 시각</span><span class="summary-val">${startedFmt}</span></div>
          <div class="summary-list-item"><span class="summary-key">특사경 자격</span><span class="summary-val">${sjpLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">분기</span><span class="summary-val">${branchLabel}</span></div>
          <div class="summary-list-item"><span class="summary-key">진행 경로</span><span class="summary-val" style="word-break:keep-all;">${pathLabel()}</span></div>
        </div>
      </div>
      <div class="summary-section">
        <h3>완료 항목 (${checkEntries.length}건)</h3>
        <div class="summary-list" style="font-size:.82rem;color:var(--ink-soft);">
          ${checkEntries.length ? checkEntries.map(e => {
            return `<div class="summary-check${e.onPath ? '' : ' summary-offpath'}"><span class="summary-time">${e.time ? fmtClock(e.time) : '✓'}</span><span>${e.label}${e.onPath ? '' : ' — 되돌아간 분기'}</span></div>`;
          }).join('') : '<div style="color:var(--text-muted-soft);">완료 항목 없음</div>'}
        </div>
        <p class="card-desc" style="font-size:.8rem;color:var(--text-muted);margin:.6rem 0 0;">시각은 항목을 체크한 때입니다. 실제 조치 시각과 다르면 경위서에는 실제 시각을 적으십시오.${hasOffPath ? ' "되돌아간 분기"는 뒤로 돌아가 다른 경로를 택하기 전에 체크한 항목입니다.' : ''}</p>
      </div>
      <div class="nav-row">
        <button class="nav-btn secondary" onclick="copyReport()">📋 요약 복사</button>
        <button class="nav-btn primary" onclick="if(confirm('새 사건으로 진행하시겠습니까? 현재 기록은 삭제됩니다.')){clearState();navigate('start');}">새 사건 ›</button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════
//   상태 머신 액션
// ═══════════════════════════════════════════

function renderState(stateId) {
  const state = STATES[stateId];
  if (!state) return;
  document.getElementById('app').innerHTML = state.render();
  document.getElementById('toast').classList.remove('show');   // 앞 화면의 안내가 새 화면을 가리지 않게
  renderBreadcrumb(state);
  window.scrollTo(0, 0);
  if (state.onMount) state.onMount();
  document.getElementById('resumeBtn').style.display = (stateId === 'start' && resumableCase()) ? '' : 'none';
}

function navigate(stateId) {
  const state = STATES[stateId];
  if (!state) { console.warn('Unknown state:', stateId); return; }

  if (state.track && !caseState.track) caseState.track = state.track;

  caseState.trail.push(stateId);
  // 'start' 화면은 진행 시작 전이므로 저장하지 않음 (이전 saved 보존)
  if (stateId !== 'start') saveState();

  renderState(stateId);
}

// 필수 항목 체크 검증 후 진행. 미체크 시 토스트 + 시각 강조
function tryNavigate(targetState, stateId, requiredIds) {
  const missing = requiredIds.filter(id => !caseState.checks[`${stateId}.${id}`]);
  if (missing.length > 0) {
    showToast(`필수 항목 ${missing.length}개를 먼저 체크해 주십시오`, 'warn');
    let first = null;
    missing.forEach(id => {
      const el = document.querySelector(`[data-check-id="${stateId}.${id}"]`);
      if (el) {
        // 디자인 시스템 규칙 6(허용 모션 외 금지) — 흔들림 대신 정적 색 강조. 체크할 때까지 유지
        el.classList.add('miss');
        if (!first) first = el;
      }
    });
    // 버튼은 목록 아래에 있어 빠진 항목이 화면 밖일 수 있음 — 첫 항목으로 즉시 이동(모션 없음)
    if (first) first.scrollIntoView({ block: 'center' });
    return;
  }
  navigate(targetState);
}

// 특사경 역할 설정 후 진행
function setSjpRole(isSjp) {
  if (resumableCase()) {
    if (!confirm('이 기기에 저장된 진행 중 사건이 있습니다. 새 사건을 시작하면 그 기록은 지워집니다. 계속하시겠습니까?')) return;
    try { localStorage.removeItem('appraisal_case'); } catch (e) {}
  }
  caseState.is_sjp = isSjp;
  // 사건 시작 시각 — 앱을 열어둔 시각이 아니라 실제 절차 진입 시점에 기록
  if (!caseState.startedAt) caseState.startedAt = new Date().toISOString();
  navigate('arrival');
}

function goBack() {
  if (caseState.trail.length <= 1) {
    caseState.trail = [];   // 'start' 중복 축적 방지
    navigate('start');
    return;
  }
  caseState.trail.pop(); // remove current
  const prev = caseState.trail.pop();
  navigate(prev);
}

function renderBreadcrumb(state) {
  const crumb = document.getElementById('breadcrumb');
  const items = state.crumb || ['시작'];
  const trackClass = ''; // 트랙 이름은 구조색(쪽빛) — 적은 경고·위반에만 (규칙 4)
  crumb.innerHTML = items.map((c, i) => {
    if (i === 0) return `<span class="breadcrumb-track ${trackClass}">${c}</span>`;
    const isLast = i === items.length - 1;
    return `<span class="breadcrumb-sep">›</span><span class="breadcrumb-step ${isLast?'current':''}">${c}</span>`;
  }).join('');
}

function toggleCheck(id, el) {
  if (!caseState.checkLabels) caseState.checkLabels = {};
  if (!caseState.checkTimes) caseState.checkTimes = {};
  const now = !caseState.checks[id];
  caseState.checks[id] = now;
  if (now) { caseState.checkTimes[id] = new Date().toISOString(); el.classList.remove('miss'); }
  else delete caseState.checkTimes[id];
  el.classList.toggle('checked', now);
  el.setAttribute('aria-checked', now ? 'true' : 'false');
  // 요약·기록에서 내부 ID 대신 사람이 읽는 라벨이 나오도록 보존
  const labelEl = el.querySelector('.check-label-text');
  if (labelEl) caseState.checkLabels[id] = labelEl.textContent.trim();
  saveState();
}

function copyReport() {
  const { trackLabel, sjpLabel, branchLabel } = computeCaseLabels();

  let txt = `[감정 절차 기록]\n`;
  txt += `진입 트랙: ${trackLabel}\n`;
  txt += `시작 시각: ${fmtTime(caseState.startedAt)}\n`;
  txt += `특사경 자격: ${sjpLabel}\n`;
  txt += `분기: ${branchLabel}\n`;
  txt += `진행 경로: ${pathLabel()}\n\n`;

  const checks = collectChecks();
  if (checks.length) {
    txt += `[완료 항목 ${checks.length}건 — 시각은 체크한 때]\n`;
    checks.forEach(e => { txt += `${e.time ? fmtClock(e.time) : '✓'} ${e.label}${e.onPath ? '' : ' (되돌아간 분기)'}\n`; });
  }
  txt += `\n기록 출력: ${fmtTime(new Date().toISOString())}\n`;

  const fallback = () => {
    const pre = document.createElement('pre');
    pre.style.cssText = 'white-space:pre-wrap;font-family:var(--font-body);font-size:.85rem;user-select:text;';
    pre.textContent = txt;
    showModal('요약 — 길게 눌러 복사', '');
    document.getElementById('modalBody').appendChild(pre);
  };
  // 보안 연결이 아니거나 권한이 없으면 clipboard 자체가 없을 수 있음
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => {
      showToast('요약이 클립보드에 복사되었습니다', 'success');
    }).catch(fallback);
  } else {
    fallback();
  }
}

// ═══════════════════════════════════════════
//   초기화
// ═══════════════════════════════════════════

document.getElementById('resetBtn').onclick = () => {
  // 절차에 들어가지 않은 첫 화면에서는 지울 것이 없음 — 저장된 다른 사건은 첫 화면 카드에서만 지움
  if (!caseState.startedAt) { caseState.trail = []; navigate('start'); return; }
  if (!confirm('진행 중인 사건이 있습니다. 처음으로 돌아가면 삭제됩니다. 계속하시겠습니까?')) return;
  clearState();
  navigate('start');
};

function resumeCase() {
  const saved = resumableCase();
  if (!saved) { showToast('복구할 진행 상태가 없습니다', 'warn'); return; }
  caseState = saved;
  const lastState = saved.trail[saved.trail.length - 1];
  renderState(STATES[lastState] ? lastState : 'arrival');
  showToast('이전 진행 상태를 복구했습니다', 'success');
}

function discardSaved() {
  if (!confirm('저장된 사건 기록을 지우고 새로 시작합니다. 계속하시겠습니까?')) return;
  clearState();
  navigate('start');
}

document.getElementById('resumeBtn').onclick = resumeCase;

// 모달 배경 클릭 시 닫기
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// Esc 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
